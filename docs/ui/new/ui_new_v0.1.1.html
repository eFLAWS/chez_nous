<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chez nous - Mes Logements</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex justify-center items-center font-sans antialiased selection:bg-emerald-500 selection:text-white p-4">

  <!-- CONTENEUR MOBILE / CARD PRINCIPALE -->
  <div class="w-full max-w-md min-h-screen sm:min-h-[720px] sm:h-[780px] sm:rounded-[40px] bg-slate-900/90 border border-slate-800/80 shadow-2xl relative overflow-hidden flex flex-col justify-between p-6 md:p-8 backdrop-blur-2xl">

    <!-- HALOS DE LUMIÈRE DÉCORATIFS (Glow Émeraude & Lime) -->
    <div class="absolute -top-24 -left-24 w-72 h-72 bg-emerald-500/20 rounded-full blur-[90px] pointer-events-none"></div>
    <div class="absolute -bottom-24 -right-24 w-72 h-72 bg-lime-400/15 rounded-full blur-[90px] pointer-events-none"></div>

    <!-- =============================================================== -->
    <!-- BARRE SUPÉRIEURE : PROFIL & DÉCONNEXION                         -->
    <!-- =============================================================== -->
    <div class="flex items-center justify-between relative z-10 pt-2">
      <div class="flex items-center gap-2.5 bg-slate-950/60 border border-slate-800/80 px-3 py-1.5 rounded-full">
        <div class="w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs font-bold">
          A
        </div>
        <span class="text-xs font-semibold text-slate-300">admin</span>
      </div>

      <button class="flex items-center gap-2 text-xs font-bold text-slate-400 hover:text-rose-400 transition-colors duration-200 bg-slate-950/40 hover:bg-slate-950/80 px-3 py-1.5 rounded-full border border-slate-800/50">
        <i class="fa-solid fa-arrow-right-from-bracket"></i>
        <span>Déconnexion</span>
      </button>
    </div>

    <!-- =============================================================== -->
    <!-- TITRE & SOUS-TITRE                                              -->
    <!-- =============================================================== -->
    <div class="text-center space-y-2 relative z-10 my-auto pt-4">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-slate-950 border border-slate-800 text-emerald-400 shadow-inner mb-2">
        <i class="fa-solid fa-house-user text-2xl"></i>
      </div>
      <h1 class="text-2xl font-black text-white tracking-tight">Mes logements</h1>
      <p class="text-xs text-slate-400 max-w-[250px] mx-auto font-medium leading-relaxed">
        Vous n'avez aucun foyer actif pour le moment. Créez-en un ou rejoignez votre équipe !
      </p>
    </div>

    <!-- =============================================================== -->
    <!-- BOUTONS / CARTES D'ACTION                                       -->
    <!-- =============================================================== -->
    <div class="grid grid-cols-1 gap-4 relative z-10 mb-auto pb-6">

      <!-- OPTION 1 : CRÉER UN LOGEMENT (Action Principale) -->
      <button class="group relative w-full p-5 rounded-2xl bg-gradient-to-br from-emerald-500/10 via-slate-900 to-slate-900 border border-emerald-500/40 hover:border-emerald-400 text-left transition-all duration-300 shadow-lg hover:shadow-emerald-500/10 hover:-translate-y-0.5">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 text-slate-950 flex items-center justify-center font-black shadow-md shadow-emerald-500/20 group-hover:scale-105 transition-transform duration-200">
              <i class="fa-solid fa-plus text-lg"></i>
            </div>
            <div>
              <h3 class="text-sm font-extrabold text-white group-hover:text-emerald-400 transition-colors">Créer un logement</h3>
              <p class="text-[11px] text-slate-400 font-medium">Dessiner un plan 2D / 2.5D et inviter vos proches</p>
            </div>
          </div>
          <i class="fa-solid fa-chevron-right text-slate-600 group-hover:text-emerald-400 group-hover:translate-x-1 transition-all text-xs"></i>
        </div>
      </button>

      <!-- OPTION 2 : REJOINDRRE UN LOGEMENT (Action Secondaire) -->
      <button class="group relative w-full p-5 rounded-2xl bg-slate-950/60 border border-slate-800 hover:border-slate-700 text-left transition-all duration-300 hover:-translate-y-0.5">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-xl bg-slate-900 border border-slate-800 text-teal-400 flex items-center justify-center font-bold group-hover:border-teal-500/50 group-hover:scale-105 transition-all duration-200">
              <i class="fa-solid fa-link text-base"></i>
            </div>
            <div>
              <h3 class="text-sm font-extrabold text-white group-hover:text-teal-400 transition-colors">Rejoindre un logement</h3>
              <p class="text-[11px] text-slate-400 font-medium">Entrer un code d'invitation reçu</p>
            </div>
          </div>
          <i class="fa-solid fa-chevron-right text-slate-600 group-hover:text-teal-400 group-hover:translate-x-1 transition-all text-xs"></i>
        </div>
      </button>

    </div>

    <!-- FOOTER / SUPPORT -->
    <div class="text-center relative z-10 pb-2">
      <p class="text-[11px] text-slate-500">
        Besoin d'aide ? <a href="#" class="text-slate-400 hover:text-emerald-400 font-semibold underline">Consulter le guide</a>
      </p>
    </div>

  </div>

</body>
</html>
