<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chez nous - Connexion / Inscription</title>
  
  <!-- ================================================================= -->
  <!-- DÉPENDANCES (Tailwind CSS + FontAwesome)                          -->
  <!-- ================================================================= -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<!-- ARRIÈRE-PLAN : Dégradé frais Vert Émeraude / Lime / Jaune Ambre -->
<body class="bg-gradient-to-br from-emerald-100 via-lime-50 to-amber-100 min-h-screen flex items-center justify-center p-4 font-sans relative overflow-x-hidden">

  <!-- BULLES LUMINEUSES DE FOND (Glow effect vert & jaune) -->
  <div class="absolute top-10 -left-16 w-72 h-72 bg-emerald-300/40 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-10 -right-16 w-72 h-72 bg-amber-300/50 rounded-full blur-3xl pointer-events-none"></div>

  <!-- ================================================================= -->
  <!-- CADRE APPLICATION MOBILE-FIRST (Max-w-sm pour écran smartphone)   -->
  <!-- ================================================================= -->
  <div class="w-full max-w-sm bg-white/90 backdrop-blur-xl rounded-[32px] shadow-2xl border border-emerald-100 p-6 space-y-5 relative z-10">

    <!-- EN-TÊTE : LOGO + TITRE DU FOYER -->
    <div class="text-center space-y-1.5">
      <!-- Badge Logo Vert & Jaune -->
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-600 via-green-500 to-amber-400 text-white shadow-lg shadow-emerald-200/80 mb-1">
        <i class="fa-solid fa-house-chimney-window text-2xl"></i>
      </div>
      <h1 class="text-2xl font-black text-slate-800 tracking-tight">Chez nous</h1>
      <p id="sub-heading-text" class="text-xs font-bold text-emerald-700/80">
        Bienvenue ! Créez votre compte foyer
      </p>
    </div>

    <!-- =============================================================== -->
    <!-- COMMUTATEUR S'INSCRIRE / SE CONNECTER (Style Pilule)            -->
    <!-- =============================================================== -->
    <div class="bg-emerald-50/80 p-1.5 rounded-2xl flex relative border border-emerald-100">
      <!-- Onglet S'inscrire -->
      <button id="tab-signup" onclick="switchTab('signup')" class="flex-1 py-2.5 text-xs font-black rounded-xl transition duration-200 bg-emerald-600 text-white shadow-md shadow-emerald-200">
        S'inscrire
      </button>
      <!-- Onglet Se connecter -->
      <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-2.5 text-xs font-bold rounded-xl transition duration-200 text-slate-600 hover:text-emerald-800">
        Se connecter
      </button>
    </div>

    <!-- =============================================================== -->
    <!-- FORMULAIRE MOBILE                                               -->
    <!-- =============================================================== -->
    <form id="auth-form" onsubmit="event.preventDefault();" class="space-y-3.5">

      <!-- PRÉNOM & NOM (Grille 2 colonnes) -->
      <div id="group-name" class="grid grid-cols-2 gap-2.5 transition-all duration-300">
        <!-- Prénom -->
        <div>
          <label class="block text-[10px] font-extrabold text-slate-700 uppercase tracking-wider mb-1">Prénom</label>
          <div class="relative">
            <i class="fa-solid fa-user absolute left-3 top-1/2 -translate-y-1/2 text-emerald-500 text-xs"></i>
            <input type="text" placeholder="Alex" class="w-full pl-8 pr-2.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 placeholder-slate-400 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 transition">
          </div>
        </div>
        <!-- Nom -->
        <div>
          <label class="block text-[10px] font-extrabold text-slate-700 uppercase tracking-wider mb-1">Nom</label>
          <div class="relative">
            <i class="fa-regular fa-user absolute left-3 top-1/2 -translate-y-1/2 text-emerald-500 text-xs"></i>
            <input type="text" placeholder="Martin" class="w-full pl-8 pr-2.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 placeholder-slate-400 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 transition">
          </div>
        </div>
      </div>

      <!-- EMAIL -->
      <div>
        <label class="block text-[10px] font-extrabold text-slate-700 uppercase tracking-wider mb-1">Email</label>
        <div class="relative">
          <i class="fa-solid fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-emerald-500 text-xs"></i>
          <input type="email" placeholder="alex@foyer.fr" class="w-full pl-8 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 placeholder-slate-400 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 transition">
        </div>
      </div>

      <!-- MOT DE PASSE -->
      <div>
        <label class="block text-[10px] font-extrabold text-slate-700 uppercase tracking-wider mb-1">Mot de passe</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-emerald-500 text-xs"></i>
          <input id="password-input" type="password" placeholder="••••••••" class="w-full pl-8 pr-9 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 placeholder-slate-400 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 transition">
          <!-- Bouton Afficher / Masquer -->
          <button type="button" onclick="togglePassword('password-input', 'eye-icon-1')" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-emerald-600 transition p-1">
            <i id="eye-icon-1" class="fa-solid fa-eye text-xs"></i>
          </button>
        </div>
      </div>

      <!-- CONFIRMER MOT DE PASSE -->
      <div id="group-confirm-password" class="transition-all duration-300">
        <label class="block text-[10px] font-extrabold text-slate-700 uppercase tracking-wider mb-1">Confirmer mot de passe</label>
        <div class="relative">
          <i class="fa-solid fa-shield-halved absolute left-3 top-1/2 -translate-y-1/2 text-emerald-500 text-xs"></i>
          <input id="confirm-password-input" type="password" placeholder="••••••••" class="w-full pl-8 pr-9 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 placeholder-slate-400 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 transition">
          <!-- Bouton Afficher / Masquer -->
          <button type="button" onclick="togglePassword('confirm-password-input', 'eye-icon-2')" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-emerald-600 transition p-1">
            <i id="eye-icon-2" class="fa-solid fa-eye text-xs"></i>
          </button>
        </div>
      </div>

      <!-- BOUTON D'ACTION PRINCIPAL (Dégradé Émeraude à Jaune Ambre) -->
      <button id="submit-btn" type="submit" class="w-full mt-3 py-3.5 bg-gradient-to-r from-emerald-600 via-green-500 to-amber-400 text-white font-extrabold text-sm rounded-2xl shadow-lg shadow-emerald-200 hover:brightness-105 active:scale-[0.98] transition duration-200 flex items-center justify-center gap-2">
        <span>Créer mon compte</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </button>

    </form>

    <!-- LIEN SECONDATION / MENTIONS -->
    <div class="text-center pt-1">
      <p class="text-[10px] text-slate-400 font-medium">
        En continuant, vous acceptez les <a href="#" class="text-emerald-700 hover:underline font-extrabold">Règles du foyer</a>.
      </p>
    </div>

  </div>

  <!-- ================================================================= -->
  <!-- JAVASCRIPT (SÉCURITÉ & ONGLETS)                                  -->
  <!-- ================================================================= -->
  <script>
    // 1. Afficher/Masquer le mot de passe
    function togglePassword(inputId, eyeIconId) {
      const input = document.getElementById(inputId);
      const eyeIcon = document.getElementById(eyeIconId);

      if (input.type === "password") {
        input.type = "text";
        eyeIcon.classList.remove("fa-eye");
        eyeIcon.classList.add("fa-eye-slash");
      } else {
        input.type = "password";
        eyeIcon.classList.remove("fa-eye-slash");
        eyeIcon.classList.add("fa-eye");
      }
    }

    // 2. Bascule dynamique entre S'inscrire et Se connecter
    function switchTab(mode) {
      const tabSignup = document.getElementById('tab-signup');
      const tabLogin = document.getElementById('tab-login');
      const groupName = document.getElementById('group-name');
      const groupConfirm = document.getElementById('group-confirm-password');
      const submitBtnSpan = document.querySelector('#submit-btn span');
      const subHeadingText = document.getElementById('sub-heading-text');

      if (mode === 'login') {
        // Style Mode Connexion
        tabLogin.className = "flex-1 py-2.5 text-xs font-black rounded-xl transition duration-200 bg-emerald-600 text-white shadow-md shadow-emerald-200";
        tabSignup.className = "flex-1 py-2.5 text-xs font-bold rounded-xl transition duration-200 text-slate-600 hover:text-emerald-800";

        // Masquer les champs inutiles
        groupName.classList.add('hidden');
        groupConfirm.classList.add('hidden');

        // Textes mis à jour
        submitBtnSpan.textContent = "Se connecter";
        subHeadingText.textContent = "Ravi de vous revoir au foyer !";
      } else {
        // Style Mode Inscription
        tabSignup.className = "flex-1 py-2.5 text-xs font-black rounded-xl transition duration-200 bg-emerald-600 text-white shadow-md shadow-emerald-200";
        tabLogin.className = "flex-1 py-2.5 text-xs font-bold rounded-xl transition duration-200 text-slate-600 hover:text-emerald-800";

        // Réafficher les champs d'inscription
        groupName.classList.remove('hidden');
        groupConfirm.classList.remove('hidden');

        // Textes mis à jour
        submitBtnSpan.textContent = "Créer mon compte";
        subHeadingText.textContent = "Bienvenue ! Créez votre compte foyer";
      }
    }
  </script>

</body>
</html>
