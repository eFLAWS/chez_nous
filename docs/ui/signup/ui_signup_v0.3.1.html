<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chez nous - Connexion / Inscription</title>
  
  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Configuration des couleurs personnalisées -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              emerald: '#10b981',
              lime: '#84cc16',
              amber: '#f59e0b',
              dark: '#090d16'
            }
          }
        }
      }
    }
  </script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex justify-center items-center font-sans antialiased selection:bg-emerald-500 selection:text-white">

  <!-- ================================================================= -->
  <!-- CONTENEUR DU TÉLÉPHONE (Plein écran sur Mobile, carte sur PC)     -->
  <!-- ================================================================= -->
  <div class="w-full max-w-md min-h-screen sm:min-h-[780px] sm:h-[840px] sm:rounded-[40px] bg-slate-900/90 border border-slate-800/80 shadow-2xl relative overflow-hidden flex flex-col justify-between p-6 md:p-8 backdrop-blur-2xl">

    <!-- LUEURS NÉON DÉCORATIVES EN ARRIÈRE-PLAN (Glow Vert/Jaune subtil) -->
    <div class="absolute -top-24 -left-24 w-72 h-72 bg-emerald-500/20 rounded-full blur-[90px] pointer-events-none"></div>
    <div class="absolute -bottom-24 -right-24 w-72 h-72 bg-amber-400/15 rounded-full blur-[90px] pointer-events-none"></div>

    <!-- =============================================================== -->
    <!-- SECTION HAUTE : LOGO + TITRE + TOGGLE ONGLETS                  -->
    <!-- =============================================================== -->
    <div class="space-y-6 relative z-10 pt-4">
      
      <!-- LOGO & ENTÊTE -->
      <div class="text-center space-y-2">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-500 via-teal-500 to-lime-400 text-slate-950 shadow-lg shadow-emerald-500/25 mb-1">
          <i class="fa-solid fa-house-chimney-window text-3xl"></i>
        </div>
        <h1 class="text-3xl font-black tracking-tight text-white">Chez nous</h1>
        <p id="sub-heading-text" class="text-xs font-semibold text-emerald-400/90 tracking-wide">
          Bienvenue ! Créez votre compte foyer
        </p>
      </div>

      <!-- COMMUTATEUR S'INSCRIRE / SE CONNECTER -->
      <div class="bg-slate-950/80 p-1.5 rounded-2xl flex border border-slate-800/80 shadow-inner">
        <button id="tab-signup" onclick="switchTab('signup')" class="flex-1 py-3 text-xs font-black rounded-xl transition-all duration-300 bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 shadow-md shadow-emerald-500/20">
          S'inscrire
        </button>
        <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-3 text-xs font-bold rounded-xl transition-all duration-300 text-slate-400 hover:text-white">
          Se connecter
        </button>
      </div>

    </div>

    <!-- =============================================================== -->
    <!-- SECTION CENTRALE : FORMULAIRE (Hauteur flexible et fluide)      -->
    <!-- =============================================================== -->
    <form id="auth-form" onsubmit="event.preventDefault();" class="space-y-4 relative z-10 my-auto py-4">

      <!-- CHAMPS PRÉNOM & NOM -->
      <div id="group-name" class="grid grid-cols-2 gap-3 transition-all duration-300">
        <div>
          <label class="block text-[10px] font-extrabold text-slate-400 uppercase tracking-wider mb-1.5">Prénom</label>
          <div class="relative">
            <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-emerald-400 text-xs"></i>
            <input type="text" placeholder="Alex" class="w-full pl-9 pr-3 py-3 bg-slate-950/60 border border-slate-800 rounded-xl text-xs font-semibold text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
          </div>
        </div>
        <div>
          <label class="block text-[10px] font-extrabold text-slate-400 uppercase tracking-wider mb-1.5">Nom</label>
          <div class="relative">
            <i class="fa-regular fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-emerald-400 text-xs"></i>
            <input type="text" placeholder="Martin" class="w-full pl-9 pr-3 py-3 bg-slate-950/60 border border-slate-800 rounded-xl text-xs font-semibold text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
          </div>
        </div>
      </div>

      <!-- CHAMP EMAIL -->
      <div>
        <label class="block text-[10px] font-extrabold text-slate-400 uppercase tracking-wider mb-1.5">Email</label>
        <div class="relative">
          <i class="fa-solid fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-emerald-400 text-xs"></i>
          <input type="email" placeholder="alex@foyer.fr" class="w-full pl-9 pr-3 py-3 bg-slate-950/60 border border-slate-800 rounded-xl text-xs font-semibold text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
        </div>
      </div>

      <!-- CHAMP MOT DE PASSE -->
      <div>
        <label class="block text-[10px] font-extrabold text-slate-400 uppercase tracking-wider mb-1.5">Mot de passe</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-emerald-400 text-xs"></i>
          <input id="password-input" type="password" placeholder="••••••••" class="w-full pl-9 pr-10 py-3 bg-slate-950/60 border border-slate-800 rounded-xl text-xs font-semibold text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
          <button type="button" onclick="togglePassword('password-input', 'eye-icon-1')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-emerald-400 transition p-1">
            <i id="eye-icon-1" class="fa-solid fa-eye text-xs"></i>
          </button>
        </div>
      </div>

      <!-- CHAMP CONFIRMER MOT DE PASSE -->
      <div id="group-confirm-password" class="transition-all duration-300">
        <label class="block text-[10px] font-extrabold text-slate-400 uppercase tracking-wider mb-1.5">Confirmer le mot de passe</label>
        <div class="relative">
          <i class="fa-solid fa-shield-halved absolute left-3.5 top-1/2 -translate-y-1/2 text-emerald-400 text-xs"></i>
          <input id="confirm-password-input" type="password" placeholder="••••••••" class="w-full pl-9 pr-10 py-3 bg-slate-950/60 border border-slate-800 rounded-xl text-xs font-semibold text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
          <button type="button" onclick="togglePassword('confirm-password-input', 'eye-icon-2')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-emerald-400 transition p-1">
            <i id="eye-icon-2" class="fa-solid fa-eye text-xs"></i>
          </button>
        </div>
      </div>

      <!-- BOUTON D'ACTION PRINCIPAL -->
      <button id="submit-btn" type="submit" class="w-full mt-4 py-4 bg-gradient-to-r from-emerald-500 via-teal-400 to-lime-400 hover:brightness-110 active:scale-[0.98] text-slate-950 font-black text-sm rounded-2xl shadow-lg shadow-emerald-500/20 transition duration-200 flex items-center justify-center gap-2">
        <span>Créer mon compte</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </button>

    </form>

    <!-- =============================================================== -->
    <!-- SECTION BASSE : FOOTER & MENTIONS                               -->
    <!-- =============================================================== -->
    <div class="text-center pt-2 pb-2 relative z-10">
      <p class="text-[11px] text-slate-500 font-medium">
        En continuant, vous acceptez les <a href="#" class="text-emerald-400 hover:underline font-bold">Règles du foyer</a>.
      </p>
    </div>

  </div>

  <!-- JAVASCRIPT -->
  <script>
    function togglePassword(inputId, eyeIconId) {
      const input = document.getElementById(inputId);
      const eyeIcon = document.getElementById(eyeIconId);

      if (input.type === "password") {
        input.type = "text";
        eyeIcon.classList.remove("fa-eye");
        eyeIcon.classList.add("fa-eye-slash");
      } else {
        input.type = "password";
        eyeIcon.classList.remove("fa-eye-slash");
        eyeIcon.classList.add("fa-eye");
      }
    }

    function switchTab(mode) {
      const tabSignup = document.getElementById('tab-signup');
      const tabLogin = document.getElementById('tab-login');
      const groupName = document.getElementById('group-name');
      const groupConfirm = document.getElementById('group-confirm-password');
      const submitBtnSpan = document.querySelector('#submit-btn span');
      const subHeadingText = document.getElementById('sub-heading-text');

      const activeClass = "flex-1 py-3 text-xs font-black rounded-xl transition-all duration-300 bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 shadow-md shadow-emerald-500/20";
      const inactiveClass = "flex-1 py-3 text-xs font-bold rounded-xl transition-all duration-300 text-slate-400 hover:text-white";

      if (mode === 'login') {
        tabLogin.className = activeClass;
        tabSignup.className = inactiveClass;

        groupName.classList.add('hidden');
        groupConfirm.classList.add('hidden');

        submitBtnSpan.textContent = "Se connecter";
        subHeadingText.textContent = "Ravi de vous revoir au foyer !";
      } else {
        tabSignup.className = activeClass;
        tabLogin.className = inactiveClass;

        groupName.classList.remove('hidden');
        groupConfirm.classList.remove('hidden');

        submitBtnSpan.textContent = "Créer mon compte";
        subHeadingText.textContent = "Bienvenue ! Créez votre compte foyer";
      }
    }
  </script>

</body>
</html>
